<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photographic Style Port</title>
<meta name="description" content="Adds the Photographic Styles palette, introduced with iPhone 16, to HEIC photos from earlier iPhones, plus the Texture and Grain controls on iOS 27. Runs entirely in your browser; photos are never uploaded.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Style Port">
<meta property="og:title" content="Photographic Style Port">
<meta property="og:description" content="Adds the Photographic Styles palette, introduced with iPhone 16, to HEIC photos from earlier iPhones, plus the Texture and Grain controls on iOS 27. Runs entirely in your browser; photos are never uploaded.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230062cc'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>
  /* Light by default; dark from the system or an explicit data-theme. One accent: blue. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #17191e;
    --muted: #5a6170;
    --line: #dde1e7;
    --line-strong: #c5cbd5;
    --accent: #0062cc;          /* buttons and fills: 5.8:1 with white */
    --accent-hover: #0052ad;
    --accent-text: #0057b8;     /* accent used as text on the surface */
    --accent-soft: #e8f1fb;
    --ok: #15803d;
    --err: #c62828;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui,
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei",
            "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --radius: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111317; --surface: #181b20; --fg: #e6e8ec; --muted: #9aa2b0;
      --line: #2b3038; --line-strong: #3a414c; --accent-text: #5aa9ff;
      --accent-soft: #0f2238; --ok: #4ade80; --err: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111317; --surface: #181b20; --fg: #e6e8ec; --muted: #9aa2b0;
    --line: #2b3038; --line-strong: #3a414c; --accent-text: #5aa9ff;
    --accent-soft: #0f2238; --ok: #4ade80; --err: #ff8a80; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    padding: max(1.75rem, env(safe-area-inset-top)) 16px max(3rem, env(safe-area-inset-bottom));
  }
  main { max-width: 44rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  a { color: var(--accent-text); }
  b { font-weight: 650; color: var(--fg); }
  code { font-family: var(--mono); font-size: .9em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

  /* Header */
  .top { display: flex; align-items: center; gap: .75rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line); }
  .logo { width: 36px; height: 36px; flex: none; }
  .title { flex: 1; min-width: 0; }
  h1 { font-size: 1.3rem; line-height: 1.25; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .tagline { display: block; margin-top: .1rem; font-size: .85rem; color: var(--muted); }
  #lang {
    display: inline-flex; align-items: center; gap: .35rem; flex: none;
    font: inherit; font-size: .82rem; font-weight: 600; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .3rem .65rem; cursor: pointer; white-space: nowrap;
  }
  #lang svg { width: 14px; height: 14px; color: var(--muted); }
  #lang:hover { border-color: var(--accent); }
  #lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .top-actions { display: flex; align-items: center; gap: .75rem; flex: none; }
  #about { font-size: .82rem; font-weight: 600; white-space: nowrap; }
  @media (max-width: 34rem) {
    .top-actions { flex-direction: column-reverse; align-items: flex-end; gap: .4rem; }
  }
  .sub { color: var(--muted); margin: 0; font-size: .92rem; }

  /* Notices: a plain card with a blue rule on the left */
  .notice { border-left: 3px solid var(--accent); }
  .notice h2 { display: flex; align-items: center; gap: .45rem; }
  .notice h2 svg { width: 17px; height: 17px; color: var(--accent-text); flex: none; }

  /* Drop zone */
  #drop {
    display: flex; flex-direction: column; align-items: center; gap: .35rem; text-align: center;
    cursor: pointer; padding: 1.9rem 1.25rem; background: var(--surface);
    border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
    transition: border-color .15s, background-color .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .drop-icon { color: var(--accent-text); margin-bottom: .2rem; }
  .drop-icon svg { width: 30px; height: 30px; display: block; }
  #drop strong { display: block; font-size: 1.02rem; }
  #drop span { color: var(--muted); font-size: .86rem; max-width: 30rem; }
  input[type=file] { display: none; }

  /* Photo Library tip */
  .tip {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .7rem; align-items: start;
    padding: .85rem 1rem; border-radius: var(--radius); background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tip svg { width: 20px; height: 20px; color: var(--accent-text); margin-top: .1rem; }
  .tip h2 { margin: 0 0 .15rem; font-size: .93rem; }
  .tip p { margin: 0; font-size: .88rem; color: var(--muted); }

  /* Analysis switch */
  .opts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .75rem; align-items: start; padding: .85rem 1rem; }
  .opts label { color: var(--muted); font-size: .87rem; cursor: pointer; }
  #quality {
    appearance: none; -webkit-appearance: none; margin: .1rem 0 0; cursor: pointer;
    width: 40px; height: 24px; border-radius: 999px; position: relative;
    background: var(--line-strong); transition: background-color .15s;
  }
  #quality::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; transition: transform .15s;
  }
  #quality:checked { background: var(--accent); }
  #quality:checked::after { transform: translateX(16px); }
  #quality:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Results: one line per file name, buttons below it on narrow screens */
  #list { display: flex; flex-direction: column; gap: .5rem; }
  #list:empty { display: none; }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; align-items: center;
    padding: .75rem .9rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  }
  .row .name { min-width: 0; font-family: var(--mono); font-size: .85rem; font-weight: 600;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .status { grid-column: 1; display: flex; gap: .45rem; align-items: baseline; min-width: 0;
                 color: var(--muted); font-size: .85rem; overflow-wrap: break-word; }
  .row .status::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%;
                         transform: translateY(-1px); background: var(--accent); }
  .row .status.ok { color: var(--ok); }
  .row .status.ok::before { background: var(--ok); }
  .row .status.err { color: var(--err); }
  .row .status.err::before { background: var(--err); }
  .row .act { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: .35rem; }
  .row .act:empty { display: none; }
  .dl {
    display: inline-flex; justify-content: center; align-items: center; padding: .4rem .85rem;
    border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    text-decoration: none; font: inherit; font-size: .85rem; font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  .dl:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .dl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dl.alt { background: var(--surface); color: var(--accent-text); border-color: var(--line-strong); }
  .dl.alt:hover { border-color: var(--accent); background: var(--surface); }
  @media (max-width: 34rem) {
    .row { grid-template-columns: minmax(0, 1fr); }
    .row .act { grid-column: 1; grid-row: auto; flex-direction: row; flex-wrap: wrap; margin-top: .45rem; }
    .row .act .dl { flex: 1 1 8rem; }
  }

  /* Information sections */
  .notes { display: flex; flex-direction: column; gap: .75rem; margin-top: .5rem; }
  section.card { padding: .95rem 1.05rem; }
  section h2 { font-size: .98rem; margin: 0 0 .5rem; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: .6rem; }
  /* Not a grid: the text arrives as HTML with <b> inside, and a grid would turn every
     fragment into its own cell. The number sits in the padding instead. */
  .steps li { counter-increment: s; position: relative; min-height: 22px; padding: .05rem 0 0 2rem;
              color: var(--muted); font-size: .89rem; }
  .steps li::before {
    content: counter(s); position: absolute; left: 0; top: .1rem; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700;
  }
  .bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
  .bullets li { position: relative; padding-left: 1rem; color: var(--muted); font-size: .89rem; }
  .bullets li::before { content: ""; position: absolute; left: .1rem; top: .62em; width: 5px; height: 5px;
                        border-radius: 1px; background: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: .3rem; }
  footer #version { font-family: var(--mono); color: var(--fg); }
  #boot:empty { display: none; }
  .err { color: var(--err); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <svg class="logo" viewBox="0 0 36 36" aria-hidden="true">
      <rect width="36" height="36" rx="8" fill="#0062cc"/>
      <circle cx="18" cy="18" r="8" fill="none" stroke="#fff" stroke-width="2.5"/>
      <circle cx="18" cy="18" r="2.8" fill="#fff"/>
    </svg>
    <div class="title">
      <h1 data-i18n="meta.title">Photographic Style Port</h1>
      <span class="tagline" data-i18n="app.tagline"></span>
    </div>
    <div class="top-actions">
    <a id="about" data-i18n="about.name" data-i18n-href="about.href" target="_blank" rel="noopener"
       href="https://github.com/nathanatgit/Shalielie#readme">About this page</a>
    <button id="lang" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/></svg>
      <span data-i18n="lang.name">中文</span>
    </button>
    </div>
  </header>

  <section class="card notice" aria-labelledby="notice-h">
    <h2 id="notice-h">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
      <span data-i18n="h.notice"></span>
    </h2>
    <ul class="bullets">
      <li data-i18n="n.1"></li>
      <li data-i18n="n.2"></li>
    </ul>
  </section>

  <p class="sub" data-i18n="app.lede"></p>

  <div id="drop" role="button" tabindex="0">
    <div class="drop-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
    </div>
    <strong data-i18n="drop.big"></strong>
    <span data-i18n="drop.small"></span>
  </div>
  <input type="file" id="file" multiple
         accept="image/heic,image/heif,.heic,.heif">

  <div class="tip" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/></svg>
    <div>
      <h2 data-i18n="tip.title"></h2>
      <p data-i18n="tip.body"></p>
    </div>
  </div>

  <div class="opts card">
    <input type="checkbox" id="quality" role="switch" checked>
    <label for="quality" data-i18n="opt.quality"></label>
  </div>

  <div id="list" aria-live="polite"></div>
  <p id="boot"></p>

  <div class="notes">
    <section class="card">
      <h2 data-i18n="h.steps"></h2>
      <ol class="steps">
        <li data-i18n="s.1"></li>
        <li data-i18n="s.2"></li>
        <li data-i18n="s.3"></li>
        <li data-i18n="s.4"></li>
      </ol>
    </section>

    <section class="card">
      <h2 data-i18n="h.get"></h2>
      <ul class="bullets">
        <li data-i18n="g.1"></li>
        <li data-i18n="g.2"></li>
        <li data-i18n="g.3"></li>
        <li data-i18n="g.4"></li>
        <li data-i18n="g.5"></li>
        <li data-i18n="g.6"></li>
      </ul>
    </section>

    <section class="card">
      <h2 data-i18n="h.trouble"></h2>
      <ul class="bullets">
        <li data-i18n="t.1"></li>
        <li data-i18n="t.2"></li>
        <li data-i18n="t.3"></li>
        <li data-i18n="t.4"></li>
      </ul>
    </section>
  </div>

  <footer><span data-i18n="p.version"></span> <span id="version"></span> · <a href="https://github.com/nathanatgit/Shalielie">GitHub</a></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
